# Native ST-Link DAP attachment. No reset/halt/resume, flash driver, work area,
# watchdog freeze, peripheral writes, or target event scripts are configured.
bindto 127.0.0.1
gdb_port disabled
telnet_port disabled
adapter driver st-link
st-link vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754 0x0483 0x3755 0x0483 0x3757
transport select dapdirect_swd
adapter speed 1000
reset_config none
swd newdap hero cpu -expected-id 0x2ba01477
dap create hero.dap -chain-position hero.cpu
target create hero.cpu cortex_m -endian little -dap hero.dap
init
